[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform-engine-backend"
version = "0.1.0"
description = "Backend services for AI Platform Engine"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Ranganath Reddy Mulinti" }
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "httpx>=0.28",
    "pre-commit>=4.2",
    "flake8>=6.0",  # Add flake8 to the dev dependencies
    "sqlalchemy>=2.0.41",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM"
]

ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
mypy_path = "backend/src"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]