repos:
-   repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
    - id: black

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.28
    hooks:
    - id: ruff

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.4.0
    hooks:
    - id: mypy
      args: ["--python-version=3.12", "--strict"]

-   repo: https://github.com/pytest-dev/pytest
    rev: 7.4.0
    hooks:
    - id: pytest
